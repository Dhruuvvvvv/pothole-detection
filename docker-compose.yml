version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: roadguard-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
